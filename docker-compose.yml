name: telegram-media-downloader

x-app-common: &app-common
  build:
    context: .
    args:
      PYTHON_VERSION: "${PYTHON_VERSION:-3.14.5}"
      APP_UID: "${APP_UID:-10001}"
      APP_GID: "${APP_GID:-10001}"
  image: "${TMB_IMAGE:-telegram-media-downloader-bot:local}"
  # Bound crash retries so a startup/permission failure cannot spin forever.
  restart: "on-failure:5"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=128m,mode=1777
  stop_grace_period: 45s
  user: "${APP_UID:-10001}:${APP_GID:-10001}"
  volumes:
    - ./config.yaml:/app/config.yaml:ro
    - ./data:/data
  depends_on:
    redis:
      condition: service_healthy

services:
  local-api:
    <<: *app-common
    profiles: ["local-api"]
    command:
      [
        "telegram-media-bot",
        "local-api",
        "--config",
        "/app/config.yaml",
        "serve",
      ]
    depends_on: {}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8081),3); s.close()",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  bot:
    <<: *app-common
    command: ["telegram-media-bot", "bot", "--config", "/app/config.yaml"]
    healthcheck:
      disable: true

  worker:
    <<: *app-common
    # 0 means unlimited; operators can persist a cap such as 1.5 in .env.
    cpus: "${TMB_WORKER_CPUS:-0}"
    command: ["telegram-media-bot", "worker", "--config", "/app/config.yaml"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis-data:
