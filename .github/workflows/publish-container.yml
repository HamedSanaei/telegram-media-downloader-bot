name: Publish container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

env:
  IMAGE_NAME: ghcr.io/hamedsanaei/telegram-media-downloader-bot

jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parse complete release Bash scripts
        shell: bash
        run: |
          bash -n install.sh
          bash -n manage.sh
          bash -n scripts/tmb.sh
          bash -n scripts/build_release_archives.sh
          bash -n scripts/tests/test_tmb_update.sh
          bash -n scripts/tests/test_tmb_upgrade_integration.sh
          bash -n scripts/tests/test_readonly_logger_preflight.sh
      - name: Verify tag matches package version
        shell: bash
        run: |
          python scripts/check_release_policy.py --version "$GITHUB_REF_NAME"
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", tag):
              raise SystemExit(f"Release tag is not valid SemVer: {tag}")
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match pyproject.toml version {version}")
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=3.14.5
          cache-from: type=gha,scope=telegram-media-downloader-bot-amd64
          cache-to: type=gha,mode=max,scope=telegram-media-downloader-bot-amd64
      - name: Pull and smoke-test published image
        shell: bash
        run: |
          image="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker pull "$image"
          docker run --rm "$image" telegram-media-bot --help
          docker run --rm "$image" sh -c \
            'test "$(python -m gallery_dl --config-ignore --version)" = "1.32.8"'
          docker run --rm "$image" \
            python -m telegram_media_bot.infrastructure.gallerydl.smoke
          docker run --rm "$image" \
            python -m telegram_media_bot.infrastructure.ytdlp.native_selection_smoke
          docker run --rm "$image" \
            python -m telegram_media_bot.telegram.native_ui_smoke
          docker run --rm --entrypoint sh "$image" -c '
            set -eu
            command -v ffmpeg
            command -v ffprobe
            test "$(id -u)" = 10001
            test -w /data/downloads
            python -c "from importlib.resources import files; root=files(\"telegram_media_bot.assets.licenses\"); notice=root.joinpath(\"THIRD_PARTY_NOTICES.md\").read_text(); assert all(x in notice for x in (\"gallery-dl\", \"1.32.8\", \"GPL-2.0\")); assert \"GNU GENERAL PUBLIC LICENSE\" in root.joinpath(\"gallery-dl-GPL-2.0.txt\").read_text()"
            seven_zip="$(command -v 7zz || command -v 7z)"
            dd if=/dev/zero of=/tmp/source.bin bs=1M count=3
            "$seven_zip" a -tzip -mx=0 -v1m /tmp/smoke.zip /tmp/source.bin
            test -s /tmp/smoke.zip.001
            test -s /tmp/smoke.zip.002
            "$seven_zip" t /tmp/smoke.zip.001
          '
          mkdir -p runtime-smoke
          touch runtime-smoke/cookies.txt
          chmod 0644 runtime-smoke/cookies.txt
          docker run --rm \
            -v "${PWD}/config.example.yaml:/app/config.example.yaml:ro" \
            -v "${PWD}/runtime-smoke/cookies.txt:/data/cookies/cookies.txt:ro" \
            "$image" telegram-media-bot doctor --config /app/config.example.yaml
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e DISPLAY= \
            "$image" \
            python -m telegram_media_bot.infrastructure.analytics.usage_chart_smoke \
              --output-dir /tmp/usage-chart-smoke --verify-uid 10001
          docker tag "$image" telegram-media-downloader-bot:ci
      - name: Run privileged updater filesystem and SQLite integration test
        shell: bash
        env:
          RUN_PRIVILEGED_UPGRADE_TESTS: "1"
        run: |
          TMB_READONLY_IMAGE=telegram-media-downloader-bot:ci \
            bash scripts/tests/test_readonly_logger_preflight.sh
          TMB_TEST_PREVIOUS_VERSION=1.0.2 \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.2.1 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_ACTIVE_LOCAL_API_LOG_WRITER=1 \
            TMB_TEST_INITIAL_SERVICE_STATE=all-running \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_UPDATER_FAILURE_STAGE=backup \
            TMB_TEST_INITIAL_SERVICE_STATE=all-running \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_UPDATER_FAILURE_STAGE=offline-doctor \
            TMB_TEST_INITIAL_SERVICE_STATE=all-running \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_UPDATER_FAILURE_STAGE=online-doctor \
            TMB_TEST_INITIAL_SERVICE_STATE=all-running \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_INITIAL_SERVICE_STATE=no-local-api \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_INITIAL_SERVICE_STATE=no-bot \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_INITIAL_SERVICE_STATE=mixed \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.1 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_INITIAL_SERVICE_STATE=all-running \
            bash scripts/tests/test_tmb_upgrade_integration.sh

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Build and verify reproducible source archives
        shell: bash
        run: |
          set -euo pipefail
          commit="${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "$commit"

          mkdir reproducibility-check
          bash scripts/build_release_archives.sh "$commit" .
          bash scripts/build_release_archives.sh "$commit" reproducibility-check
          cmp telegram-media-downloader-bot.tar.gz \
            reproducibility-check/telegram-media-downloader-bot.tar.gz
          cmp telegram-media-downloader-bot.zip \
            reproducibility-check/telegram-media-downloader-bot.zip
          cmp tmb-updater.sh reproducibility-check/tmb-updater.sh
          cmp tmb-updater.sh.sha256 reproducibility-check/tmb-updater.sh.sha256
          sha256sum --check telegram-media-downloader-bot.tar.gz.sha256
          sha256sum --check telegram-media-downloader-bot.zip.sha256
          sha256sum --check tmb-updater.sh.sha256
          archive_listing="$(tar -tvf telegram-media-downloader-bot.tar.gz)"
          grep -Eq \
            '^lrwxrwxrwx .* telegram-media-downloader-bot/scripts/tmb.sh -> tmb-current.sh$' \
            <<<"$archive_listing"
          grep -Eq \
            '^-rwxr-xr-x .* telegram-media-downloader-bot/scripts/tmb-current.sh$' \
            <<<"$archive_listing"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            telegram-media-downloader-bot.tar.gz
            telegram-media-downloader-bot.tar.gz.sha256
            telegram-media-downloader-bot.zip
            telegram-media-downloader-bot.zip.sha256
            tmb-updater.sh
            tmb-updater.sh.sha256
