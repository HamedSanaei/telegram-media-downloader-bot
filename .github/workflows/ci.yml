name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Parse complete release Bash scripts
        shell: bash
        run: |
          bash -n install.sh
          bash -n manage.sh
          bash -n scripts/tmb.sh
          bash -n scripts/build_release_archives.sh
          bash -n scripts/tests/test_tmb_update.sh
          bash -n scripts/tests/test_tmb_upgrade_integration.sh
      - run: uv python install 3.14.5
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/check_architecture.py
      - run: uv run python scripts/check_text_integrity.py
      - run: uv run python scripts/generate_file_manifest.py --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pre-commit run detect-secrets --all-files
      - run: uv run pip check
      - run: uv run pip-audit --local --skip-editable --progress-spinner off
      - run: uv build
      - name: Verify external extractor SDK
        working-directory: plugins/example_extractor
        run: |
          uv lock --check
          uv sync --frozen --group dev
          uv run pytest -m "not contract"
      - run: uv run pytest -m "not contract" --cov=telegram_media_bot --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - name: Parse complete release Bash scripts
        shell: bash
        run: |
          bash -n install.sh
          bash -n manage.sh
          bash -n scripts/tmb.sh
          bash -n scripts/build_release_archives.sh
          bash -n scripts/tests/test_tmb_update.sh
          bash -n scripts/tests/test_tmb_upgrade_integration.sh
      - run: uv lock --check
      - run: docker compose --profile local-api config
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image with shared cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          pull: true
          platforms: linux/amd64
          tags: telegram-media-downloader-bot:ci
          build-args: |
            PYTHON_VERSION=3.14.5
          cache-from: type=gha,scope=telegram-media-downloader-bot-amd64
          cache-to: type=gha,mode=max,scope=telegram-media-downloader-bot-amd64
      - name: Smoke-test runtime image
        shell: bash
        run: |
          docker run --rm telegram-media-downloader-bot:ci telegram-media-bot --help
          docker run --rm telegram-media-downloader-bot:ci \
            python -m telegram_media_bot.infrastructure.ytdlp.native_selection_smoke
          docker run --rm telegram-media-downloader-bot:ci \
            python -m telegram_media_bot.telegram.native_ui_smoke
          docker run --rm --entrypoint sh telegram-media-downloader-bot:ci -c '
            set -eu
            command -v ffmpeg
            command -v ffprobe
            seven_zip="$(command -v 7zz || command -v 7z)"
            dd if=/dev/zero of=/tmp/source.bin bs=1M count=3
            "$seven_zip" a -tzip -mx=0 -v1m /tmp/smoke.zip /tmp/source.bin
            test -s /tmp/smoke.zip.001
            test -s /tmp/smoke.zip.002
            "$seven_zip" t /tmp/smoke.zip.001
          '
          docker run --rm \
            -v "${PWD}/config.example.yaml:/app/config.example.yaml:ro" \
            telegram-media-downloader-bot:ci \
            telegram-media-bot doctor --config /app/config.example.yaml
      - name: Run privileged updater filesystem and SQLite integration test
        shell: bash
        env:
          RUN_PRIVILEGED_UPGRADE_TESTS: "1"
        run: bash scripts/tests/test_tmb_upgrade_integration.sh

  installer-quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck Linux management scripts
        if: runner.os == 'Linux'
        run: shellcheck install.sh manage.sh scripts/tmb.sh scripts/tests/*.sh
      - name: Parse complete release Bash scripts
        if: runner.os == 'Linux'
        run: |
          bash -n install.sh
          bash -n manage.sh
          bash -n scripts/tmb.sh
          bash -n scripts/build_release_archives.sh
          bash -n scripts/tests/test_tmb_update.sh
          bash -n scripts/tests/test_tmb_upgrade_integration.sh
      - name: Test Linux update recovery
        if: runner.os == 'Linux'
        run: bash scripts/tests/test_tmb_update.sh
      - name: Install PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell management scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $issues = @("install.ps1", "scripts/tmb.ps1") | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse
          }
          $issues | Format-Table
          $errors = $issues | Where-Object Severity -eq Error
          if ($errors) { throw "PSScriptAnalyzer reported installer errors." }
      - name: Test Windows update recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/Test-TmbUpdate.ps1
