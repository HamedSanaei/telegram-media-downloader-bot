name: CI

# Tiered fast-feedback validation (T033).
#
# The workflow always starts (no workflow-level `paths:` filter) so stable required checks always
# report. `change-detection` deterministically classifies the changed paths (scripts/ci_change_policy.py)
# and routes: ordinary changes run the fast `quality` lane; relevant heavy lanes (dependency,
# package, plugin-sdk, docker-runtime, updater-integration, installer-linux, installer-windows) run
# only when their owned paths changed or full validation is requested. `final-ci-gate` is a stable
# always-evaluating check that understands success/failure/cancelled/skipped. Classification that
# fails, cannot resolve a base, or meets an unknown/root-critical file fails conservative and runs
# every heavy lane.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run every heavy validation lane
        required: false
        default: "false"
        type: boolean
  # Optional nightly full validation for drift/cold-cache coverage. Cadence chosen conservatively;
  # it shares the development concurrency group, so a fresh main push supersedes it.
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  # Development runs cancel safely when a newer commit arrives on the same ref. Publication uses a
  # separate workflow with cancellation disabled (see publish-container.yml) so an in-flight
  # release transaction is never abandoned mid-publication.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-detection:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      dependency: ${{ steps.classify.outputs.dependency }}
      package: ${{ steps.classify.outputs.package }}
      plugin_sdk: ${{ steps.classify.outputs.plugin_sdk }}
      docker: ${{ steps.classify.outputs.docker }}
      updater: ${{ steps.classify.outputs.updater }}
      installer_linux: ${{ steps.classify.outputs.installer_linux }}
      installer_windows: ${{ steps.classify.outputs.installer_windows }}
      conservative: ${{ steps.classify.outputs.conservative }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths into CI lanes
        id: classify
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          BASE=""
          HEAD="$GITHUB_SHA"
          FULL="0"

          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "$EVENT" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            # workflow_dispatch / schedule always request full validation.
            FULL="1"
          fi

          CHANGED_FILE="/tmp/ci-changed.txt"
          : > "$CHANGED_FILE"
          if [ "$FULL" = "0" ]; then
            if [ -z "$BASE" ] \
               || [[ "$BASE" =~ ^0+$ ]] \
               || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              # Base cannot be resolved (first push, detached history): fail conservative.
              FULL="1"
            else
              git diff --name-only "$BASE" "$HEAD" > "$CHANGED_FILE" \
                || FULL="1"
            fi
          fi

          MAIN_PUSH="0"
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            MAIN_PUSH="1"
          fi

          if [ "$FULL" = "1" ]; then
            python3 scripts/ci_change_policy.py --full --json > /tmp/policy.json
          elif [ "$MAIN_PUSH" = "1" ]; then
            python3 scripts/ci_change_policy.py --paths-file "$CHANGED_FILE" \
              --main-push --json > /tmp/policy.json
          else
            python3 scripts/ci_change_policy.py --paths-file "$CHANGED_FILE" --json \
              > /tmp/policy.json
          fi

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/policy.json", encoding="utf-8") as handle:
              policy = json.load(handle)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for lane in (
                  "docs_only", "dependency", "package", "plugin_sdk", "docker",
                  "updater", "installer_linux", "installer_windows", "conservative",
              ):
                  out.write(f"{lane}={str(bool(policy.get(lane, False))).lower()}\n")
          PY

  quality:
    needs: [change-detection]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv python install 3.14.5
      # scripts/check_agent_context.py is the repo-navigation guard that must run in CI (enforced
      # by check_agent_context.py itself); ci_fast_quality.sh / ci_docs_quality.sh invoke it.
      - name: Documentation-integrity fast lane
        if: ${{ needs.change-detection.outputs.docs_only == 'true' }}
        run: bash scripts/ci_docs_quality.sh
      - name: Full fast-quality lane
        if: ${{ needs.change-detection.outputs.docs_only != 'true' }}
        run: bash scripts/ci_fast_quality.sh
      - uses: actions/upload-artifact@v4
        if: ${{ needs.change-detection.outputs.docs_only != 'true' }}
        with:
          name: coverage-xml
          path: coverage.xml

  dependency:
    needs: [change-detection]
    if: always() && needs.change-detection.outputs.dependency == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv python install 3.14.5
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      # PYSEC-2026-3721 affects the uv-seeded bootstrap pip (<26.2) that pip-audit scans in
      # --local mode. Tooling pip is not a locked runtime dependency, so refresh it inside the
      # job environment right before auditing instead of weakening or skipping the audit.
      # --no-sync is required on both steps: a plain "uv run" would restore the seeded
      # vulnerable pip before the audit executes.
      - name: Upgrade seeded tooling pip above the audited vulnerability floor
        run: uv run --no-sync python -m pip install --upgrade "pip>=26.2"
      - run: >-
          uv run --no-sync pip-audit --local --skip-editable --progress-spinner off

  package:
    needs: [change-detection]
    if: always() && needs.change-detection.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv python install 3.14.5
      - run: uv sync --frozen --group dev
      - run: uv build
      - name: Verify wheel, sdist, font license, and clean wheel install
        run: uv run python scripts/check_package_assets.py --install-smoke

  plugin-sdk:
    needs: [change-detection]
    if: always() && needs.change-detection.outputs.plugin_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Verify external extractor SDK
        working-directory: plugins/example_extractor
        run: |
          uv python install 3.14.5
          uv lock --check
          uv sync --frozen --group dev
          uv run pytest -m "not contract"

  docker-runtime:
    needs: [change-detection]
    if: always() && needs.change-detection.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - run: uv lock --check
      - name: Validate rendered Compose restart policy for all services
        run: |
          docker compose --profile local-api config --format json \
            | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          names = ("bot", "worker", "local-api", "redis")
          wrong = {n: services[n].get("restart") for n in names
                   if services[n].get("restart") != "unless-stopped"}
          assert not wrong, f"restart policy mismatch: {wrong}"
          '
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image with shared cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          pull: true
          platforms: linux/amd64
          tags: telegram-media-downloader-bot:ci
          build-args: |
            PYTHON_VERSION=3.14.5
          cache-from: type=gha,scope=telegram-media-downloader-bot-amd64
          cache-to: type=gha,mode=max,scope=telegram-media-downloader-bot-amd64
      - name: Smoke-test runtime image
        shell: bash
        run: |
          mkdir -p usage-chart-artifacts
          chmod 0777 usage-chart-artifacts
          touch usage-chart-artifacts/cookies.txt
          chmod 0644 usage-chart-artifacts/cookies.txt
          docker run --rm telegram-media-downloader-bot:ci telegram-media-bot --help
          docker run --rm telegram-media-downloader-bot:ci sh -c \
            'test "$(python -m gallery_dl --config-ignore --version)" = "1.32.8"'
          docker run --rm telegram-media-downloader-bot:ci \
            python -m telegram_media_bot.infrastructure.gallerydl.smoke
          docker run --rm telegram-media-downloader-bot:ci \
            python -m telegram_media_bot.infrastructure.ytdlp.native_selection_smoke
          docker run --rm telegram-media-downloader-bot:ci \
            python -m telegram_media_bot.telegram.native_ui_smoke
          docker run --rm --network none --read-only \
            --tmpfs /data:rw,noexec,nosuid,size=64m,mode=1777,uid=10001,gid=10001 \
            -v "${PWD}/config.example.yaml:/app/config.example.yaml:ro" \
            telegram-media-downloader-bot:ci \
            python -m telegram_media_bot.infrastructure.ytdlp.inspection_workspace_smoke \
              --config /app/config.example.yaml
          docker run --rm --entrypoint sh telegram-media-downloader-bot:ci -c '
            set -eu
            command -v ffmpeg
            command -v ffprobe
            test "$(id -u)" = 10001
            test -w /data/downloads
            python -c "from importlib.resources import files; root=files(\"telegram_media_bot.assets.licenses\"); notice=root.joinpath(\"THIRD_PARTY_NOTICES.md\").read_text(); assert all(x in notice for x in (\"gallery-dl\", \"1.32.8\", \"GPL-2.0\")); assert \"GNU GENERAL PUBLIC LICENSE\" in root.joinpath(\"gallery-dl-GPL-2.0.txt\").read_text()"
            seven_zip="$(command -v 7zz || command -v 7z)"
            dd if=/dev/zero of=/tmp/source.bin bs=1M count=3
            "$seven_zip" a -tzip -mx=0 -v1m /tmp/smoke.zip /tmp/source.bin
            test -s /tmp/smoke.zip.001
            test -s /tmp/smoke.zip.002
            "$seven_zip" t /tmp/smoke.zip.001
          '
          docker run --rm \
            -v "${PWD}/config.example.yaml:/app/config.example.yaml:ro" \
            -v "${PWD}/usage-chart-artifacts/cookies.txt:/data/cookies/cookies.txt:ro" \
            telegram-media-downloader-bot:ci \
            telegram-media-bot doctor --config /app/config.example.yaml
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e DISPLAY= \
            -v "${PWD}/usage-chart-artifacts:/artifacts" \
            telegram-media-downloader-bot:ci \
            python -m telegram_media_bot.infrastructure.analytics.usage_chart_smoke \
              --output-dir /artifacts --verify-uid 10001
      - name: Upload Docker usage-chart smoke images
        uses: actions/upload-artifact@v4
        with:
          name: usage-chart-smoke
          path: |
            usage-chart-artifacts/usage-chart-weekly-smoke.png
            usage-chart-artifacts/usage-chart-monthly-smoke.png
          if-no-files-found: error

  updater-integration:
    needs: [change-detection]
    if: always() && needs.change-detection.outputs.updater == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - run: uv lock --check
      - name: Parse release Bash scripts (independent packaged verification)
        run: |
          bash -n install.sh
          bash -n manage.sh
          bash -n scripts/tmb.sh
          bash -n scripts/build_release_archives.sh
          bash -n scripts/tests/test_tmb_update.sh
          bash -n scripts/tests/test_tmb_upgrade_integration.sh
          bash -n scripts/tests/test_local_api_readiness.sh
      - name: Run privileged updater filesystem and SQLite integration test
        shell: bash
        env:
          RUN_PRIVILEGED_UPGRADE_TESTS: "1"
        run: |
          TMB_TEST_PREVIOUS_VERSION=1.0.2 \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.2.1 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_ACTIVE_LOCAL_API_LOG_WRITER=1 \
            TMB_TEST_INITIAL_SERVICE_STATE=all-running \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_UPDATER_FAILURE_STAGE=backup \
            TMB_TEST_INITIAL_SERVICE_STATE=all-running \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_UPDATER_FAILURE_STAGE=offline-doctor \
            TMB_TEST_INITIAL_SERVICE_STATE=all-running \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_UPDATER_FAILURE_STAGE=online-doctor \
            TMB_TEST_INITIAL_SERVICE_STATE=all-running \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_INITIAL_SERVICE_STATE=no-local-api \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_INITIAL_SERVICE_STATE=no-bot \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.0 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_INITIAL_SERVICE_STATE=mixed \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          TMB_TEST_PREVIOUS_VERSION=1.3.1 TMB_USE_RELEASE_UPDATER_ASSET=1 \
            TMB_TEST_INITIAL_SERVICE_STATE=all-running \
            bash scripts/tests/test_tmb_upgrade_integration.sh
          RUN_PRIVILEGED_UPGRADE_TESTS=1 \
            bash scripts/tests/test_local_api_readiness.sh

  installer-linux:
    needs: [change-detection]
    if: always() && needs.change-detection.outputs.installer_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck Linux management scripts
        run: shellcheck install.sh manage.sh scripts/tmb.sh scripts/tests/*.sh
      - name: Parse complete release Bash scripts
        run: |
          bash -n install.sh
          bash -n manage.sh
          bash -n scripts/tmb.sh
          bash -n scripts/build_release_archives.sh
          bash -n scripts/tests/test_tmb_update.sh
          bash -n scripts/tests/test_tmb_upgrade_integration.sh
          bash -n scripts/tests/test_local_api_readiness.sh
      - name: Test Linux update recovery
        run: bash scripts/tests/test_tmb_update.sh

  installer-windows:
    needs: [change-detection]
    if: always() && needs.change-detection.outputs.installer_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Some GitHub-hosted Windows images (e.g. windows-2025) ship without a
          # usable PSGallery/NuGet bootstrap; repair it instead of skipping lint.
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
              Write-Host "Bootstrapping NuGet package provider..."
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
          }

          $repository = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
          if (-not $repository) {
              Write-Host "PSGallery is not registered; registering default repositories..."
              Register-PSRepository -Default
          }

          $repository = Get-PSRepository -Name PSGallery -ErrorAction Stop
          Write-Host "Using PowerShell repository: $($repository.Name)"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                  Write-Host "Installing PSScriptAnalyzer (attempt $attempt/3)..."
                  Install-Module PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
                  $installed = $true
                  break
              }
              catch {
                  if ($attempt -eq 3) {
                      throw
                  }
                  Write-Warning "PSScriptAnalyzer install attempt failed; retrying..."
                  Start-Sleep -Seconds (5 * $attempt)
              }
          }

          if (-not $installed) {
              throw "PSScriptAnalyzer installation failed."
          }

          Import-Module PSScriptAnalyzer -ErrorAction Stop
          $module = Get-Module PSScriptAnalyzer -ListAvailable |
              Sort-Object Version -Descending |
              Select-Object -First 1

          if (-not $module) {
              throw "PSScriptAnalyzer installation could not be verified."
          }

          Write-Host "PSScriptAnalyzer version: $($module.Version)"
      - name: Analyze PowerShell management scripts
        shell: pwsh
        run: |
          $issues = @("install.ps1", "scripts/tmb.ps1") | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse
          }
          $issues | Format-Table
          $errors = $issues | Where-Object Severity -eq Error
          if ($errors) { throw "PSScriptAnalyzer reported installer errors." }
      - name: Test Windows update recovery
        shell: pwsh
        run: ./scripts/tests/Test-TmbUpdate.ps1

  final-ci-gate:
    if: always()
    needs:
      - change-detection
      - quality
      - dependency
      - package
      - plugin-sdk
      - docker-runtime
      - updater-integration
      - installer-linux
      - installer-windows
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate final gate from structured job results
        env:
          CHANGE_DETECTION: ${{ needs.change-detection.result }}
          QUALITY: ${{ needs.quality.result }}
          DEP: ${{ needs.dependency.result }}
          PKG: ${{ needs.package.result }}
          PLG: ${{ needs.plugin-sdk.result }}
          DKR: ${{ needs.docker-runtime.result }}
          UPD: ${{ needs.updater-integration.result }}
          ILX: ${{ needs.installer-linux.result }}
          IWX: ${{ needs.installer-windows.result }}
          RQ_DEP: ${{ needs.change-detection.outputs.dependency }}
          RQ_PKG: ${{ needs.change-detection.outputs.package }}
          RQ_PLG: ${{ needs.change-detection.outputs.plugin_sdk }}
          RQ_DKR: ${{ needs.change-detection.outputs.docker }}
          RQ_UPD: ${{ needs.change-detection.outputs.updater }}
          RQ_ILX: ${{ needs.change-detection.outputs.installer_linux }}
          RQ_IWX: ${{ needs.change-detection.outputs.installer_windows }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          required = {
              "dependency": os.getenv("RQ_DEP") == "true",
              "package": os.getenv("RQ_PKG") == "true",
              "plugin_sdk": os.getenv("RQ_PLG") == "true",
              "docker_runtime": os.getenv("RQ_DKR") == "true",
              "updater_integration": os.getenv("RQ_UPD") == "true",
              "installer_linux": os.getenv("RQ_ILX") == "true",
              "installer_windows": os.getenv("RQ_IWX") == "true",
          }
          results = {
              "dependency": os.getenv("DEP"),
              "package": os.getenv("PKG"),
              "plugin_sdk": os.getenv("PLG"),
              "docker_runtime": os.getenv("DKR"),
              "updater_integration": os.getenv("UPD"),
              "installer_linux": os.getenv("ILX"),
              "installer_windows": os.getenv("IWX"),
          }
          problems = []
          if os.getenv("CHANGE_DETECTION") != "success":
              problems.append(f"change classification result={os.getenv('CHANGE_DETECTION')}")
          quality = os.getenv("QUALITY")
          if quality != "success":
              problems.append(f"quality lane result={quality}")
          for name, result in results.items():
              if result == "cancelled":
                  problems.append(f"{name} was cancelled")
              elif result in ("failure", "startup_failure"):
                  problems.append(f"{name} failed")
              elif result == "skipped" and required.get(name):
                  problems.append(f"{name} was required but skipped")
          if problems:
              for problem in problems:
                  print(f"::error::final gate: {problem}")
              sys.exit(1)
          print("final gate: all required lanes succeeded (irrelevant heavy lanes skipped)")
          PY
